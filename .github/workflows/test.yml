name: bff-tests

on: [pull_request, push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BFF_TEST_REDIS_CONNECTION: localhost:6379,abortConnect=false
      BFF_TEST_REDIS_OUTAGE_CONNECTION: localhost:6399,abortConnect=false,connectTimeout=500,syncTimeout=500
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pilot.Bff.sln

      - name: Verify formatting
        run: dotnet format Pilot.Bff.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pilot.Bff.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Pilot.Bff.sln --no-restore --no-build --configuration Release

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint Helm chart
        run: helm lint charts/pilot-bff

      - name: Render Helm chart
        run: helm template pilot-bff charts/pilot-bff >/tmp/pilot-bff.yaml

      - name: Build container image
        run: docker build -f src/Pilot.Bff.Api/Dockerfile -t pilot-bff:ci .
