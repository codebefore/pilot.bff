name: BFF Manual Image Publication
run-name: BFF image · ${{ inputs.request_id || github.actor }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Pilot release request identifier (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bff-image-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BFF_TEST_REDIS_CONNECTION: localhost:6379,abortConnect=false
      BFF_TEST_REDIS_OUTAGE_CONNECTION: localhost:6399,abortConnect=false,connectTimeout=500,syncTimeout=500
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pilot.Bff.sln

      - name: Verify formatting
        run: dotnet format Pilot.Bff.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pilot.Bff.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Pilot.Bff.sln --no-restore --no-build --configuration Release

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Validate Helm chart
        run: |
          helm lint charts/pilot-bff
          helm template pilot-bff charts/pilot-bff >/tmp/pilot-bff.yaml
          python3 -B scripts/test-gitops-release.py

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./src/Pilot.Bff.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/codebefore/pilot-bff:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/codebefore/pilot.bff
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Update desired production revision
        env:
          GITOPS_KEY: ${{ secrets.PILOT_GITOPS_DEPLOY_KEY }}
          GITOPS_KNOWN_HOSTS: ${{ secrets.PILOT_GITOPS_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sshdir=$(mktemp -d)
          trap 'rm -rf "$sshdir"' EXIT
          printf '%s\n' "$GITOPS_KEY" > "$sshdir/key"
          printf '%s\n' "$GITOPS_KNOWN_HOSTS" > "$sshdir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $sshdir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$sshdir/known_hosts"
          git clone --single-branch --branch gitops/bff-production \
            git@github.com:codebefore/pilot.devops.git gitops-checkout
          python3 scripts/promote-gitops-release.py
