{{- $releaseGrantEnabled := eq (lower (toString (default .Values.env.sessionEnabled .Values.env.releaseGrantEnabled))) "true" -}}
{{- $proxyEnabled := eq (lower (toString .Values.env.proxyEnabled)) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pilot-bff.fullname" . }}
  labels:
    {{- include "pilot-bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pilot-bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pilot-bff.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pilot-bff.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pilot-bff.fullname" . }}
          {{- with .Values.sessionSecrets.existingSecret }}
          env:
            - name: Redis__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.sessionSecrets.redisConnectionStringKey }}
            - name: Redis__KeyPepper
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.sessionSecrets.redisKeyPepperKey }}
            - name: Bff__DataProtection__CertificateBase64
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.sessionSecrets.dataProtectionCertificateBase64Key }}
            - name: Bff__DataProtection__CertificatePassword
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.sessionSecrets.dataProtectionCertificatePasswordKey }}
            {{- if $proxyEnabled }}
            - name: Bff__Proxy__InstitutionContextSigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.sessionSecrets.institutionContextSigningKeyKey }}
            {{- end }}
            {{- if $releaseGrantEnabled }}
            - name: ReleaseGrant__SigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.sessionSecrets.releaseGrantSigningKeyKey }}
            {{- end }}
            {{- if $.Values.sessionSecrets.dataProtectionPreviousCertificateBase64Key }}
            - name: Bff__DataProtection__PreviousCertificateBase64
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.sessionSecrets.dataProtectionPreviousCertificateBase64Key }}
            - name: Bff__DataProtection__PreviousCertificatePassword
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ required "sessionSecrets.dataProtectionPreviousCertificatePasswordKey is required with the previous certificate" $.Values.sessionSecrets.dataProtectionPreviousCertificatePasswordKey }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.healthProbes.hostHeader | quote }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.healthProbes.hostHeader | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
