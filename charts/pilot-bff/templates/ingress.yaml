{{- if .Values.ingress.enabled -}}
{{- $annotations := deepCopy .Values.ingress.annotations -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" (toString .Values.ingress.proxyBodySize) -}}
{{- if .Values.ingress.rateLimit.enabled -}}
{{- if or (lt (int .Values.ingress.rateLimit.requestsPerSecond) 1) (lt (int .Values.ingress.rateLimit.burstMultiplier) 1) (lt (int .Values.ingress.rateLimit.connections) 1) -}}
{{- fail "ingress rate-limit values must be positive integers" -}}
{{- end -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-rps" (toString .Values.ingress.rateLimit.requestsPerSecond) -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-burst-multiplier" (toString .Values.ingress.rateLimit.burstMultiplier) -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-connections" (toString .Values.ingress.rateLimit.connections) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pilot-bff.fullname" . }}
  labels:
    {{- include "pilot-bff.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "pilot-bff.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
