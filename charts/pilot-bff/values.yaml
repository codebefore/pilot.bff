replicaCount: 1

image:
  repository: pilot-bff
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

healthProbes:
  hostHeader: app.pilotyanimda.com

env:
  aspnetcoreEnvironment: Production
  timeZone: UTC
  allowedHosts: app.pilotyanimda.com
  performanceServiceName: pilot-bff
  performanceSlowRequestMs: "1000"
  performanceSlowDependencyMs: "250"
  sessionEnabled: "false"
  sessionCookieName: __Host-pilot_session
  sessionIdleTimeoutMinutes: "30"
  sessionAbsoluteTimeoutHours: "12"
  sessionAccessTokenRefreshSkewSeconds: "60"
  sessionActivityRenewalMinutes: "5"
  sessionRefreshLockLeaseSeconds: "15"
  sessionRefreshLockWaitMilliseconds: "2000"
  proxyEnabled: "false"
  proxyGatewayBaseUrl: http://pilot-gateway
  proxyTimeoutSeconds: "30"
  proxyResponseStreamingTimeoutSeconds: "300"
  proxyMaxRequestBodyBytes: "10485760"
  proxyDocumentUploadMaxRequestBodyBytes: "11534336"
  proxyInstructorDocumentUploadMaxRequestBodyBytes: "27262976"
  proxyReadRequestsPerMinute: "120"
  proxyMutationRequestsPerMinute: "30"
  proxyReadConcurrentRequests: "50"
  proxyMutationConcurrentRequests: "10"
  proxyFileTransferConcurrentRequests: "200"
  redisEnabled: "false"
  redisInstanceName: pilot
  redisEnvironmentName: production
  identityBaseUrl: http://pilot-identity
  identityTimeoutSeconds: "10"
  browserAllowedOrigin: https://app.pilotyanimda.com
  forwardedHeadersEnabled: "false"
  forwardedHeadersKnownProxies: ""
  forwardedHeadersKnownNetworks: ""
  forwardedHeadersExternalScheme: ""
  releaseGrantEnabled: ""
  releaseGrantIssuer: pilot-bff
  releaseGrantAudience: pilot-release-control
  releaseGrantLifetimeSeconds: "60"

sessionSecrets:
  existingSecret: ""
  redisConnectionStringKey: Redis__ConnectionString
  redisKeyPepperKey: Redis__KeyPepper
  dataProtectionCertificateBase64Key: Bff__DataProtection__CertificateBase64
  dataProtectionCertificatePasswordKey: Bff__DataProtection__CertificatePassword
  releaseGrantSigningKeyKey: ReleaseGrant__SigningKey
  dataProtectionPreviousCertificateBase64Key: ""
  dataProtectionPreviousCertificatePasswordKey: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  proxyBodySize: 26m
  rateLimit:
    enabled: false
    requestsPerSecond: 10
    burstMultiplier: 3
    connections: 20
  fileTransferRateLimitBypass:
    enabled: false
    paths: []
  hosts:
    - host: app.pilotyanimda.com
      paths:
        - path: /bff
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx
  ingressPodLabels:
    app.kubernetes.io/name: ingress-nginx
  applicationNamespace: ""
  # NetworkPolicy evaluates the destination pod port after Service DNAT.
  # Pilot Gateway and Identity listen on container port 8080 behind port 80 Services.
  applicationPort: 8080
  redisPort: 6379
  redisCidrs: []
  dnsNamespace: kube-system

resources: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
